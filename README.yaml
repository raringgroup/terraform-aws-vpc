# Short description of this project
description: |-
  Terraform module to provision a VPC with Internet Gateway. Contains a submodule for provisioning Interface and/or Gateway VPC Endpoints.
  This module also supports provisioning additional CIDR blocks for the VPC, with or without using [IPAM](https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html).

# How to use this project
examples: |-
  ```hcl
  module "vpc" {
    source = "git::https://github.com/raringgroup/terraform-aws-vpc.git?ref=v0.1.1"

    context = module.context.self

    ipv4_primary_cidr_block = "10.0.0.0/16"

    assign_generated_ipv6_cidr_block = true
  }
  ```

  Full example with [`terraform-aws-dynamic-subnets`](https://github.com/raringgroup/terraform-aws-dynamic-subnets):

  ```hcl
  module "vpc" {
    source = "git::https://github.com/raringgroup/terraform-aws-vpc.git?ref=v0.1.1"

    context = module.context.self

    ipv4_primary_cidr_block = "10.0.0.0/16"

    assign_generated_ipv6_cidr_block = false
  }

  module "dynamic_subnets" {
    source = "git::https://github.com/raringgroup/terraform-aws-dynamic-subnets.git?ref=v0.1.1"

    context = module.context.self

    availability_zones = ["us-west-2a", "us-west-2b", "us-west-2c"]
    vpc_id             = module.vpc.vpc_id
    igw_id             = [module.vpc.igw_id]
    ipv4_cidr_block    = [module.vpc.vpc_cidr_block]
  }
  ```

  Submodule for provisioning VPC Endpoints:

  ```hcl
  module "vpc_endpoints" {
    source = "git::https://github.com/raringgroup/terraform-aws-vpc.git//modules/vpc-endpoints?ref=v0.1.1"

    context = module.context.self

    vpc_id = module.vpc.vpc_id

    gateway_vpc_endpoints = {
      "s3" = {
        name = "s3"
        policy = jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Action = [
                "s3:*",
              ]
              Effect    = "Allow"
              Principal = "*"
              Resource  = "*"
            },
          ]
        })
      }
    }
    interface_vpc_endpoints = {
      "ec2" = {
        name                = "ec2"
        security_group_ids  = ["sg-12341234123412345"]
        subnet_ids          = module.dynamic_subnets.private_subnet_ids
        policy              = null
        private_dns_enabled = false
      }
    }
  }
  ```

